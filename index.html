<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertriebs-Tracking</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: #333;
        }
        header {
            background-color: #0056b3;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
        }
        #map {
            flex: 1;
            width: 100%;
        }
        .controls {
            padding: 15px;
            background: #f8f9fa;
            border-top: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input, button {
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input {
            flex: 1;
        }
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            padding-left: 20px;
            padding-right: 20px;
        }
        button:hover {
            background-color: #004494;
        }
        .address-hint {
            font-size: 0.85rem;
            color: #666;
        }
    </style>
</head>
<body>

    <header>Vertriebs-Tracking</header>

    <div id="map"></div>

    <div class="controls">
        <div class="address-hint">Automatische Adresssuche: Straße, Hausnummer und Ort eingeben</div>
        <div class="input-group">
            <input type="text" id="addressInput" placeholder="z.B. Schulstr. 39, St. Egidien">
            <button id="saveBtn">Speichern</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Karte initialisieren (Zentrum ca. St. Egidien / Lichtenstein)
        const map = L.map('map').setView([50.808, 12.633], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Größeres Icon für Stecknadeln definiert
        const customPinIcon = L.divIcon({
            className: 'custom-pin',
            html: '<div style="background-color: #ff3333; width: 28px; height: 28px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 6px rgba(0,0,0,0.5);"></div>',
            iconSize: [34, 34],
            iconAnchor: [17, 17],
            popupAnchor: [0, -17]
        });

        let markers = [];

        // Funktion zum Hinzufügen von Markern auf der Karte
        function addMarker(lat, lng, addressText) {
            const marker = L.marker([lat, lng], { icon: customPinIcon }).addTo(map);
            marker.bindPopup(`<b>Adresse:</b> ${addressText}`);
            markers.push(marker);
        }

        // Event für den Speichern-Button mit Nominatim Geocoding (Straße, Hausnummer, Ort)
        document.getElementById('saveBtn').addEventListener('click', function() {
            const address = document.getElementById('addressInput').value;

            if (!address) {
                alert('Bitte geben Sie eine Adresse ein.');
                return;
            }

            const queryUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`;

            fetch(queryUrl)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);
                        const displayName = data[0].display_name;

                        addMarker(lat, lon, displayName);
                        map.setView([lat, lon], 16);
                        document.getElementById('addressInput').value = '';
                    } else {
                        alert('Adresse konnte nicht gefunden werden. Bitte prüfen Sie die Eingabe (Straße, Hausnummer und Ort).');
                    }
                })
                .catch(error => {
                    console.error('Fehler bei der Adresssuche:', error);
                    alert('Verbindungsfehler bei der Adresssuche.');
                });
        });
    </script>
</body>
</html>
