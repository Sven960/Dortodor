<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D2D Tracker</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
            background-color: #f4f4f9;
            color: #333;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.3rem;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            font-size: 0.85em;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95em;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-geo {
            background-color: #007bff;
            color: white;
            margin-bottom: 15px;
        }
        .btn-submit {
            background-color: #28a745;
            color: white;
        }
        .btn-clear {
            background-color: #dc3545;
            color: white;
            padding: 6px 10px;
            font-size: 0.8em;
            width: auto;
            margin: 0;
        }
        .status {
            font-size: 0.85em;
            color: #666;
            margin-top: 4px;
        }

        /* Listen-Styling */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .entry-item {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .entry-item:last-child {
            border-bottom: none;
        }
        .entry-info {
            font-size: 0.9em;
            line-height: 1.4;
        }
        .entry-address {
            font-weight: bold;
        }
        .entry-sub {
            color: #666;
            font-size: 0.85em;
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: bold;
            margin-top: 4px;
        }
        /* Farbcodierung der Status */
        .badge-Nicht-da { background: #ffeeba; color: #856404; }
        .badge-Kein-Interesse { background: #f8d7da; color: #721c24; }
        .badge-Später-nochmal { background: #e2e3e5; color: #383d41; }
        .badge-Termin-vereinbart { background: #d1ecf1; color: #0c5460; }
        .badge-Erfolg---Kunde { background: #d4edda; color: #155724; }
        
        .btn-delete-single {
            background: transparent;
            color: #aaa;
            border: none;
            font-size: 1.2em;
            cursor: pointer;
            padding: 5px;
            width: auto;
            margin: 0;
        }
        .btn-delete-single:hover {
            color: #dc3545;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Haustür-Erfassung</h2>
    
    <button type="button" class="btn-geo" onclick="getAktuellerStandort()">📍 Standort automatisch ausfüllen</button>
    <div id="status" class="status"></div>

    <form id="trackerForm" onsubmit="speichereEintrag(event)">
        <div class="form-group">
            <label for="strasse">Straße</label>
            <input type="text" id="strasse" placeholder="z. B. Hauptstraße" required>
        </div>

        <div class="form-group">
            <label for="hausnummer">Hausnummer</label>
            <input type="text" id="hausnummer" placeholder="z. B. 12a">
        </div>

        <div class="form-group">
            <label for="plz">Postleitzahl (PLZ)</label>
            <input type="text" id="plz" placeholder="z. B. 09353">
        </div>

        <div class="form-group">
            <label for="ort">Ort</label>
            <input type="text" id="ort" placeholder="z. B. Lichtenstein">
        </div>

        <div class="form-group">
            <label for="stadtteil">Stadtteil / Ortsteil</label>
            <input type="text" id="stadtteil" placeholder="z. B. Rödlitz (falls vorhanden)">
        </div>

        <div class="form-group">
            <label for="statusSelect">Ergebnis / Status</label>
            <select id="statusSelect">
                <option value="Nicht da">Nicht da</option>
                <option value="Kein Interesse">Kein Interesse</option>
                <option value="Später nochmal">Später nochmal</option>
                <option value="Termin vereinbart">Termin vereinbart</option>
                <option value="Erfolg / Kunde">Erfolg / Kunde</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">Ergebnis Speichern</button>
    </form>
</div>

<div class="card">
    <div class="list-header">
        <h2>Erfasste Besuche (<span id="count">0</span>)</h2>
        <button class="btn-clear" onclick="alleLoeschen()">Alle löschen</button>
    </div>
    <div id="besuchsListe">
        <p style="color: #888; font-size: 0.9em;">Noch keine Einträge vorhanden.</p>
    </div>
</div>

<script>
// Beim Laden der Seite gespeicherte Daten abrufen
document.addEventListener("DOMContentLoaded", ladeBesuche);

function getAktuellerStandort() {
    const statusText = document.getElementById('status');
    statusText.innerText = "Standort wird ermittelt...";

    if (!navigator.geolocation) {
        statusText.innerText = "Geolocation wird nicht unterstützt.";
        return;
    }

    navigator.geolocation.getCurrentPosition(
        (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            statusText.innerText = "Adresse wird abgerufen...";

            fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`)
                .then(response => response.json())
                .then(data => {
                    const addr = data.address || {};

                    document.getElementById('strasse').value = addr.road || addr.pedestrian || addr.suburb || '';
                    document.getElementById('hausnummer').value = addr.house_number || '';
                    document.getElementById('plz').value = addr.postcode || '';
                    document.getElementById('ort').value = addr.city || addr.town || addr.village || addr.municipality || '';
                    document.getElementById('stadtteil').value = addr.suburb || addr.quarter || addr.neighbourhood || addr.hamlet || '';

                    statusText.innerText = "✓ Adresse eingefügt!";
                })
                .catch(err => {
                    statusText.innerText = "Fehler beim Abrufen der Adresse.";
                    console.error(err);
                });
        },
        (error) => {
            statusText.innerText = "Standortzugriff abgelehnt oder nicht verfügbar.";
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}

function speichereEintrag(event) {
    event.preventDefault();

    const neuerEintrag = {
        id: Date.now(),
        zeit: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        strasse: document.getElementById('strasse').value,
        hausnummer: document.getElementById('hausnummer').value,
        plz: document.getElementById('plz').value,
        ort: document.getElementById('ort').value,
        stadtteil: document.getElementById('stadtteil').value,
        status: document.getElementById('statusSelect').value
    };

    let besuche = JSON.parse(localStorage.getItem('d2d_besuche')) || [];
    besuche.unshift(neuerEintrag); // Neuen Eintrag ganz oben hinzufügen
    localStorage.setItem('d2d_besuche', JSON.stringify(besuche));

    // Formular zurücksetzen & Liste aktualisieren
    document.getElementById('trackerForm').reset();
    document.getElementById('status').innerText = "";
    ladeBesuche();
}

function ladeBesuche() {
    const listeContainer = document.getElementById('besuchsListe');
    const countContainer = document.getElementById('count');
    let besuche = JSON.parse(localStorage.getItem('d2d_besuche')) || [];

    countContainer.innerText = besuche.length;

    if (besuche.length === 0) {
        listeContainer.innerHTML = '<p style="color: #888; font-size: 0.9em;">Noch keine Einträge vorhanden.</p>';
        return;
    }

    listeContainer.innerHTML = "";

    besuche.forEach(item => {
        const badgeClass = "badge-" + item.status.replace(/[^a-zA-Z0-9]/g, "-");
        const ortsteilText = item.stadtteil ? ` (${item.stadtteil})` : '';

        const html = `
            <div class="entry-item">
                <div class="entry-info">
                    <div class="entry-address">${item.strasse} ${item.hausnummer}</div>
                    <div class="entry-sub">${item.plz} ${item.ort}${ortsteilText} • <small>${item.zeit} Uhr</small></div>
                    <span class="badge ${badgeClass}">${item.status}</span>
                </div>
                <button class="btn-delete-single" onclick="loescheEintrag(${item.id})" title="Löschen">✕</button>
            </div>
        `;
        listeContainer.innerHTML += html;
    });
}

function loescheEintrag(id) {
    let besuche = JSON.parse(localStorage.getItem('d2d_besuche')) || [];
    besuche = besuche.filter(item => item.id !== id);
    localStorage.setItem('d2d_besuche', JSON.stringify(besuche));
    ladeBesuche();
}

function alleLoeschen() {
    if (confirm("Möchtest du wirklich alle gespeicherten Besuche löschen?")) {
        localStorage.removeItem('d2d_besuche');
        ladeBesuche();
    }
}
</script>

</body>
</html>
