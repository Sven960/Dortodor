<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>D2D Tracker</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- SheetJS für Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
        }

        /* Karten-Container über den gesamten Bildschirm */
        #map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* UI Steuerung über der Karte */
        .controls-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 95%;
            max-width: 500px;
        }

        .filter-row, .action-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }

        .btn {
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Status Farben */
        .btn-all { background-color: #ff9800; color: #000; }
        .btn-nicht-da { background-color: #f44336; }
        .btn-angebot { background-color: #ffeb3b; color: #000; }
        .btn-termin { background-color: #9c27b0; }
        .btn-abschluss { background-color: #4caf50; }

        /* Aktionen */
        .btn-blue { background-color: #2196f3; }
        .btn-purple { background-color: #ab47bc; }
        .btn-green { background-color: #66bb6a; }

        .search-container {
            width: 100%;
            max-width: 350px;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px 8px 32px;
            border-radius: 20px;
            border: 1px solid #444;
            background-color: #222;
            color: white;
            font-size: 13px;
            outline: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%888888" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>');
            background-repeat: no-repeat;
            background-position: 10px center;
        }

        /* Standort Button unten rechts */
        .locate-btn {
            position: absolute;
            bottom: 25px;
            right: 20px;
            z-index: 1000;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #ff9800;
            border: none;
            box-shadow: 0 3px 8px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Menü-Leiste oben -->
    <div class="controls-container">
        <div class="filter-row">
            <button class="btn btn-all">Alle</button>
            <button class="btn btn-nicht-da">🔴 Nicht da</button>
            <button class="btn btn-angebot">🟡 Angebot/Zähler</button>
            <button class="btn btn-termin">🟣 Termin</button>
            <button class="btn btn-abschluss">🟢</button>
        </div>
        
        <div class="action-row">
            <button class="btn btn-blue" onclick="backupData()">💾 Sichern</button>
            <button class="btn btn-purple" onclick="restoreData()">📂 Öffnen</button>
            <button class="btn btn-green" onclick="exportExcel()">📊 Excel</button>
        </div>

        <div class="search-container">
            <input type="text" class="search-input" placeholder="Adresse suchen..." id="searchInput" onchange="searchAddress()">
        </div>
    </div>

    <!-- Karten-Div -->
    <div id="map"></div>

    <!-- GPS Button unten rechts -->
    <button class="locate-btn" onclick="locateUser()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5">
            <circle cx="12" cy="12" r="6"/>
            <line x1="12" y1="2" x2="12" y2="6"/>
            <line x1="12" y1="18" x2="12" y2="22"/>
            <line x1="2" y1="12" x2="6" y2="12"/>
            <line x1="18" y1="12" x2="22" y2="12"/>
        </svg>
    </button>

    <input type="file" id="fileInput" style="display:none;" onchange="importFile(event)">

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map;
        let markers = [];

        // Karte nach Laden des DOMs initialisieren
        document.addEventListener('DOMContentLoaded', () => {
            // Startposition (Sankt Egidien / Sachsen)
            map = L.map('map', {
                zoomControl: false
            }).setView([50.7889, 12.6133], 15);

            // OpenStreetMap CartoDB Dark Matter Tiles für dunkles Design
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap & CartoDB'
            }).addTo(map);

            // Fix für Rendering-Fehler (verhindert schwarzen Bildschirm)
            setTimeout(() => {
                map.invalidateSize();
            }, 300);
        });

        // GPS Standort bestimmen
        function locateUser() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    map.setView([lat, lng], 18);
                    L.circleMarker([lat, lng], {
                        radius: 8,
                        fillColor: "#ff9800",
                        color: "#ffffff",
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.9
                    }).addTo(map).bindPopup("Dein Standort").openPopup();
                }, () => {
                    alert("GPS-Standort konnte nicht ermittelt werden.");
                });
            }
        }

        // Adresssuche via Nominatim (OpenStreetMap)
        function searchAddress() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);
                        map.setView([lat, lon], 17);
                    } else {
                        alert("Adresse nicht gefunden.");
                    }
                });
        }

        // Daten sichern & wiederherstellen Stubs
        function backupData() {
            const data = localStorage.getItem('d2d_data') || '[]';
            const blob = new Blob([data], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'd2d_backup.json';
            a.click();
        }

        function restoreData() {
            document.getElementById('fileInput').click();
        }

        function importFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                localStorage.setItem('d2d_data', event.target.result);
                location.reload();
            };
            reader.readAsText(file);
        }

        function exportExcel() {
            alert("Excel-Export wird ausgeführt...");
        }
    </script>
</body>
</html>
